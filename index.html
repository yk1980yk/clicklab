<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クリック心理ラボ — なぜ、人は思わず行動してしまうのか</title>
<meta name="description" content="人を動かす設計を、見破る側と作る側の両方から練習する場所です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button class="lang" id="btn-lang">English</button>

<div class="shell">

  <!-- ============ タイトル ============ -->
  <section class="screen screen--title" id="screen-title">
    <span class="title__over" data-i18n="over">クリック心理ラボ</span>
    <div class="title__frame"><h1 class="title__h" data-i18n-html="h1">なぜ、人は思わず<br>行動してしまうのか</h1></div>

    <p class="title__lead" data-i18n="lead1"></p>
    <p class="title__lead" data-i18n="lead2"></p>

    <div class="scatter">
      <button class="chip chip--badge"  data-i18n="chipBadge"  data-i18n-attr="data-name:nameBadge"></button>
      <button class="chip chip--timer"  data-i18n-attr="data-name:nameTimer"><span data-sc-clock>03:00</span></button>
      <button class="chip chip--cta"    data-i18n="chipCta"    data-i18n-attr="data-name:nameCta"></button>
      <button class="chip chip--fine"   data-i18n="chipFine"   data-i18n-attr="data-name:nameFine"></button>
      <button class="chip chip--social" data-i18n="chipSocial" data-i18n-attr="data-name:nameSocial"></button>
      <button class="chip chip--shame"  data-i18n="chipShame"  data-i18n-attr="data-name:nameShame"></button>
    </div>
    <p class="scatter__hint" data-i18n="scatterHint"></p>

    <div class="notes">
      <div class="primer">
        <p class="primer__h" data-i18n="primerH"></p>
        <p class="primer__t" data-i18n="primerT1"></p>
        <p class="primer__t" data-i18n="primerT2"></p>
      </div>
      <div class="primer primer--color">
        <p class="primer__h" data-i18n="colorH"></p>
        <p class="primer__t" data-i18n="colorT1"></p>
        <p class="primer__t" data-i18n="colorT2"></p>
      </div>
    </div>

    <p class="note-reg" data-i18n="noteReg"></p>

    <div class="smsbox">
      <button class="smsbox__toggle" data-sms-toggle aria-expanded="false">
        <span class="smsbox__h" data-i18n="smsH"></span>
        <span class="smsbox__more" data-sms-label></span>
      </button>
      <div class="smsbox__body" data-sms-body hidden>
        <p class="smsbox__lead" data-i18n="smsLead"></p>
        <div class="smsbox__grid" data-sms></div>
        <p class="smsbox__hint" data-i18n="smsHint"></p>
      </div>
    </div>

    <div class="modes">
      <button class="mode" data-mode="detect">
        <span class="mode__tag mode__tag--d" data-i18n="modeDetectTag"></span>
        <span class="mode__h" data-i18n="modeDetectH"></span>
        <span class="mode__t" data-i18n="modeDetectT"></span>
        <span class="mode__foot">
          <span class="mode__meta" data-i18n="modeDetectMeta"></span>
          <span class="mode__go" data-i18n="modeStart"></span>
        </span>
        <span class="mode__resume" id="resume-detect" hidden></span>
      </button>
      <button class="mode" data-mode="design">
        <span class="mode__tag mode__tag--g" data-i18n="modeDesignTag"></span>
        <span class="mode__h" data-i18n="modeDesignH"></span>
        <span class="mode__t" data-i18n="modeDesignT"></span>
        <span class="mode__foot">
          <span class="mode__meta" data-i18n="modeDesignMeta"></span>
          <span class="mode__go" data-i18n="modeStart"></span>
        </span>
        <span class="mode__resume" id="resume-design" hidden></span>
      </button>
    </div>

    <p class="title__fine">
      <span data-i18n="fictional"></span><br>
      <span id="source-note"></span><br>
      <span data-i18n="privacy"></span>
    </p>

    <p class="help-entry"><button class="help-entry__btn" data-help data-i18n="helpLink"></button></p>

    <footer class="credit">
      <p class="credit__t" data-i18n="creditT"></p>
      <a class="credit__link" href="https://ark-corp.tokyo/" target="_blank" rel="noopener" data-i18n="creditName"></a>
    </footer>
  </section>

  <!-- ============ 検査モード ============ -->
  <section class="screen screen--stage" id="screen-stage" hidden>
    <header class="bar">
      <div class="bar__track" id="progress"></div>
      <div class="bar__meta">
        <span id="bar-count"></span>
        <span id="bar-score"></span>
      </div>
      <div class="exit">
        <button class="exit__btn" data-i18n="backTop"></button>
        <span class="exit__note" data-i18n="backNote"></span>
      </div>
    </header>

    <h2 class="stage__h"><span class="stage__no" id="stage-no">01</span><span id="stage-title"></span></h2>

    <figure class="specimen" id="specimen">
      <figcaption class="specimen__chrome">
        <span class="specimen__dots"><i></i><i></i><i></i></span>
        <span class="specimen__url" id="specimen-url"></span>
      </figcaption>
      <div class="specimen__view" id="mock"></div>
    </figure>
    <p class="scroll-hint" id="scroll-hint" data-i18n="scrollHint" hidden></p>

    <button class="btn btn--demo" id="btn-demo" hidden></button>
    <p class="demo-result" id="demo-result" hidden></p>

    <div class="ask">
      <p class="ask__q" id="question"></p>
      <div class="ask__choices" id="choices"></div>
    </div>

    <div class="reveal" id="reveal" hidden>
      <p class="reveal__verdict" id="reveal-verdict"></p>
      <p class="reveal__feedback" id="reveal-feedback"></p>
      <dl class="reveal__defs">
        <div><dt data-i18n="patternLabel"></dt><dd id="reveal-pattern"></dd></div>
        <div><dt data-i18n="psychLabel"></dt><dd id="reveal-psych"></dd></div>
      </dl>
      <p class="reveal__body" id="reveal-explain"></p>
      <div class="reveal__checks">
        <p class="reveal__checksH" data-i18n="checksH"></p>
        <ul id="reveal-checks"></ul>
      </div>
      <button class="btn btn--go" id="btn-next" data-i18n="nextStage"></button>
    </div>
  </section>

  <!-- ============ 設計モード ============ -->
  <section class="screen screen--case" id="screen-case" hidden>
    <header class="bar">
      <div class="bar__track" id="c-progress"></div>
      <div class="bar__meta">
        <span id="c-count"></span>
        <span id="c-score"></span>
      </div>
      <div class="exit">
        <button class="exit__btn" data-i18n="backTop"></button>
        <span class="exit__note" data-i18n="backNote"></span>
      </div>
    </header>

    <h2 class="stage__h"><span class="stage__no" id="c-no">01</span><span id="c-title"></span></h2>

    <div class="brief">
      <p class="brief__field" id="c-field"></p>
      <p class="brief__t" id="c-brief"></p>
    </div>

    <div class="ask">
      <p class="ask__q" id="c-question"></p>
      <div class="ask__choices" id="c-choices"></div>
    </div>

    <div class="board" id="c-now" hidden>
      <p class="board__h" data-i18n="boardNow"></p>
      <div class="board__pair">
        <div class="board__cell"><span id="c-cv" class="board__num"></span><span class="board__lab" id="c-cv-lab"></span></div>
        <div class="board__cell"><span id="c-tr" class="board__num"></span><span class="board__lab" data-i18n="boardTrust"></span></div>
      </div>
      <button class="btn btn--later" id="btn-later" data-i18n="laterBtn"></button>
    </div>

    <div class="board board--later" id="c-later" hidden>
      <p class="board__h" data-i18n="boardLater"></p>
      <p class="board__lead" id="c-later-text"></p>
      <div id="c-later-rows"></div>
    </div>

    <div class="reveal" id="c-reveal" hidden>
      <p class="reveal__verdict" id="c-verdict"></p>
      <p class="reveal__body" id="c-explain"></p>
      <p class="lesson" id="c-lesson"></p>
      <button class="btn btn--go" id="c-next" data-i18n="nextCase"></button>
    </div>
  </section>

  <!-- ============ 引っかかってしまったときに ============ -->
  <section class="screen screen--help" id="screen-help" hidden>
    <p class="title__over" data-i18n="helpOver"></p>
    <h1 class="help__h" data-i18n-html="helpH"></h1>
    <p class="help__lead" data-i18n="helpLead"></p>
    <div id="help-body"></div>

    <div class="smsbox smsbox--help">
      <button class="smsbox__toggle" data-sms-toggle aria-expanded="false">
        <span class="smsbox__h" data-i18n="smsH"></span>
        <span class="smsbox__more" data-sms-label></span>
      </button>
      <div class="smsbox__body" data-sms-body hidden>
        <p class="smsbox__lead" data-i18n="smsLead"></p>
        <div class="smsbox__grid" data-sms></div>
        <p class="smsbox__hint" data-i18n="smsHint"></p>
      </div>
    </div>
    <p class="help__note" data-i18n="helpNote"></p>
    <p class="help__disc" data-i18n="helpDisclaimer"></p>
    <button class="btn btn--sub" data-home data-i18n="helpBack"></button>
  </section>

  <!-- ============ 検査モードの結果 ============ -->
  <section class="screen screen--result" id="screen-result" hidden>
    <p class="result__over" data-i18n="resultOver"></p>
    <div class="result__score"><b id="result-score">0</b><span>/ <i id="result-max">200</i></span></div>
    <p class="result__rank" id="result-rank"></p>
    <p class="result__lead" id="result-lead"></p>
    <div class="result__breakdown">
      <p class="result__bh" data-i18n="catsH"></p>
      <div id="result-cats"></div>
    </div>
    <div class="result__missed" id="result-missed"></div>
    <button class="btn btn--go" id="btn-retry" data-i18n="retry"></button>
    <button class="btn btn--sub" id="btn-to-design" data-i18n="toDesign"></button>
    <button class="btn btn--sub" data-home data-i18n="toTop"></button>
    <p class="help-entry"><button class="help-entry__btn" data-help data-i18n="helpLink"></button></p>
  </section>

  <!-- ============ 設計モードの結果 ============ -->
  <section class="screen screen--cresult" id="screen-cresult" hidden>
    <p class="result__over" data-i18n="resultOver"></p>
    <div class="twin">
      <div class="twin__cell"><b id="cr-cv">0</b><span data-i18n="cvLabel"></span></div>
      <div class="twin__cell"><b id="cr-tr">0</b><span data-i18n="trLabel"></span></div>
    </div>
    <p class="result__rank" id="cr-rank"></p>
    <p class="result__lead" id="cr-lead"></p>
    <div class="result__breakdown">
      <p class="result__bh" data-i18n="picksH"></p>
      <div id="cr-list"></div>
    </div>
    <button class="btn btn--go" id="cr-retry" data-i18n="retryCase"></button>
    <button class="btn btn--sub" id="btn-to-detect" data-i18n="toDetect"></button>
    <button class="btn btn--sub" data-home data-i18n="toTop"></button>
    <p class="help-entry"><button class="help-entry__btn" data-help data-i18n="helpLink"></button></p>
  </section>

</div>

<script src="data/i18n.js"></script>
<script src="data/stages.js"></script>
<script src="data/cases.js"></script>
<script src="data/stages.en.js"></script>
<script src="data/cases.en.js"></script>
<script src="app.js"></script>
</body>
</html>
